name: Build Liyab Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "src/**"
      - "include/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "app/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          java -version
          cmake --version
          flutter --version
          flutter doctor -v

      - name: Build native engine and release APK
        run: scripts/build_flutter_app.sh

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: liyab-android-arm64-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
